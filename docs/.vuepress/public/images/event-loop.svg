<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 调用栈 -->
  <rect x="30" y="30" width="140" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">调用栈</text>
  <rect x="50" y="70" width="100" height="30" rx="4" fill="#bfdbfe"/>
  <text x="100" y="90" text-anchor="middle" font-size="11" fill="#1e3a8a">同步代码</text>
  <rect x="50" y="108" width="100" height="30" rx="4" fill="#dbeafe"/>
  <text x="100" y="128" text-anchor="middle" font-size="11" fill="#1e3a8a">函数调用</text>
  <text x="100" y="170" text-anchor="middle" font-size="10" fill="#64748b">后进先出</text>
  <text x="100" y="186" text-anchor="middle" font-size="10" fill="#64748b">空了才轮到队列</text>
  <!-- 微任务队列 -->
  <rect x="230" y="30" width="160" height="90" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="310" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">微任务队列</text>
  <rect x="248" y="68" width="124" height="24" rx="4" fill="#e9d5ff"/>
  <text x="310" y="85" text-anchor="middle" font-size="11" fill="#581c87">Promise.then</text>
  <text x="310" y="108" text-anchor="middle" font-size="10" fill="#a21caf">每轮全部清空</text>
  <!-- 宏任务队列 -->
  <rect x="230" y="140" width="160" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="310" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">宏任务队列</text>
  <rect x="248" y="178" width="124" height="24" rx="4" fill="#fed7aa"/>
  <text x="310" y="195" text-anchor="middle" font-size="11" fill="#7c2d12">setTimeout / 事件</text>
  <text x="310" y="218" text-anchor="middle" font-size="10" fill="#9a3412">每轮只取一个</text>
  <!-- 事件循环 -->
  <circle cx="510" cy="140" r="70" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="510" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Event Loop</text>
  <text x="510" y="158" text-anchor="middle" font-size="11" fill="#64748b">事件循环</text>
  <!-- 流向箭头 -->
  <line x1="172" y1="130" x2="222" y2="75" stroke="#a855f7" stroke-width="2"/>
  <path d="M222 75 l-8 -2 v4 z" fill="#a855f7"/>
  <line x1="172" y1="150" x2="222" y2="185" stroke="#ea580c" stroke-width="2"/>
  <path d="M222 185 l-8 -2 v4 z" fill="#ea580c"/>
  <line x1="392" y1="75" x2="452" y2="100" stroke="#a855f7" stroke-width="2"/>
  <path d="M452 100 l-8 -3 v6 z" fill="#a855f7"/>
  <line x1="392" y1="185" x2="452" y2="180" stroke="#ea580c" stroke-width="2"/>
  <path d="M452 180 l-8 -3 v6 z" fill="#ea580c"/>
  <!-- 顺序说明 -->
  <rect x="30" y="250" width="580" height="22" rx="4" fill="#f8fafc"/>
  <text x="320" y="265" text-anchor="middle" font-size="12" fill="#475569">执行顺序：同步代码 → 清空所有微任务 → 取一个宏任务 → 清空微任务 → 再取一个宏任务……</text>
</svg>
