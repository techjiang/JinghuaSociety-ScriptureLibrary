<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- XSS -->
  <rect x="20" y="20" width="290" height="125" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">XSS：脚本被塞进页面</text>
  <text x="165" y="74" text-anchor="middle" font-size="11" fill="#7f1d1d">攻击者提交 &lt;script&gt; 内容</text>
  <text x="165" y="94" text-anchor="middle" font-size="11" fill="#7f1d1d">→ 被原样存进数据库 / 拼进 HTML</text>
  <text x="165" y="114" text-anchor="middle" font-size="11" fill="#7f1d1d">→ 别人打开页面时，脚本执行</text>
  <text x="165" y="136" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">防：转义输出 + CSP + 别用 innerHTML</text>
  <!-- CSRF -->
  <rect x="330" y="20" width="290" height="125" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="475" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#c2410c">CSRF：冒用你的登录态</text>
  <text x="475" y="74" text-anchor="middle" font-size="11" fill="#7c2d12">你已登录银行网站（Cookie 有效）</text>
  <text x="475" y="94" text-anchor="middle" font-size="11" fill="#7c2d12">→ 被诱骗打开钓鱼页，自动提交转账请求</text>
  <text x="475" y="114" text-anchor="middle" font-size="11" fill="#7c2d12">→ 浏览器自动带上 Cookie，服务器信了</text>
  <text x="475" y="136" text-anchor="middle" font-size="11" fill="#c2410c" font-weight="700">防：CSRF Token + SameSite Cookie + 验证码</text>
  <!-- 共同点 -->
  <rect x="20" y="165" width="600" height="115" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="320" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">两者的共同前提</text>
  <text x="320" y="222" text-anchor="middle" font-size="12" fill="#475569">都利用了「浏览器替你做主」：Cookie 自动带、同源策略被绕开</text>
  <text x="320" y="244" text-anchor="middle" font-size="12" fill="#475569">所以防御的核心思想也一样：服务端永远别盲信浏览器带上来的东西</text>
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">（左：防「进来」；右：防「顶替」——一句话版本）</text>
</svg>
