<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="n1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- 用户 -->
  <rect x="20" y="90" width="110" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="75" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">用户浏览器</text>
  <text x="75" y="135" text-anchor="middle" font-size="10" fill="#64748b">请求网页/资源</text>
  <!-- Nginx -->
  <rect x="220" y="60" width="140" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Nginx</text>
  <text x="290" y="112" text-anchor="middle" font-size="10" fill="#16a34a">静态文件直接吐</text>
  <text x="290" y="130" text-anchor="middle" font-size="10" fill="#16a34a">Gzip 压缩</text>
  <text x="290" y="148" text-anchor="middle" font-size="10" fill="#16a34a">缓存头 / HTTPS</text>
  <text x="290" y="166" text-anchor="middle" font-size="10" fill="#16a34a">try_files 兜底</text>
  <!-- 静态资源 -->
  <rect x="450" y="30" width="160" height="55" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="530" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">dist/ 静态文件</text>
  <text x="530" y="71" text-anchor="middle" font-size="10" fill="#a16207">html/js/css/图片</text>
  <!-- API -->
  <rect x="450" y="150" width="160" height="55" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="530" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">/api/ 反向代理</text>
  <text x="530" y="191" text-anchor="middle" font-size="10" fill="#a21caf">转发到 3000 端口</text>
  <!-- 连线 -->
  <line x1="132" y1="120" x2="212" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#n1)"/>
  <line x1="362" y1="95" x2="442" y2="58" stroke="#16a34a" stroke-width="2" marker-end="url(#n1)"/>
  <line x1="362" y1="145" x2="442" y2="178" stroke="#a855f7" stroke-width="2" marker-end="url(#n1)"/>
  <text x="400" y="90" font-size="11" fill="#16a34a" font-weight="700">直接给</text>
  <text x="400" y="150" font-size="11" fill="#a21caf" font-weight="700">proxy_pass</text>
  <!-- 底部策略 -->
  <rect x="20" y="220" width="590" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="315" y="240" text-anchor="middle" font-size="11" fill="#475569">一个 server 块全搞定：静态直出 + 接口代理 + 缓存头 + Gzip + HTTPS 跳转</text>
</svg>
