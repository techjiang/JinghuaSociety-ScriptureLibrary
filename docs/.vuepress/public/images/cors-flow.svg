<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="c1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- 站点A -->
  <rect x="30" y="100" width="150" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">a.com 页面</text>
  <text x="105" y="155" text-anchor="middle" font-size="11" fill="#64748b">JS 想请求 b.com 的数据</text>
  <!-- 站点B -->
  <rect x="460" y="100" width="150" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="535" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">b.com 接口</text>
  <text x="535" y="155" text-anchor="middle" font-size="11" fill="#64748b">要表态：允许谁跨域读我</text>
  <!-- 预检 -->
  <line x1="105" y1="115" x2="530" y2="115" stroke="#ca8a04" stroke-width="2" marker-end="url(#c1)"/>
  <text x="320" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#ca8a04">OPTIONS 预检：我这样的请求你允许吗？</text>
  <line x1="535" y1="130" x2="110" y2="130" stroke="#16a34a" stroke-width="2" marker-end="url(#c1)"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Access-Control-Allow-Origin: https://a.com</text>
  <!-- 正式请求 -->
  <line x1="105" y1="185" x2="530" y2="185" stroke="#2563eb" stroke-width="2" marker-end="url(#c1)"/>
  <text x="320" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">正式 GET/POST + Origin 头</text>
  <line x1="535" y1="200" x2="110" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#c1)"/>
  <text x="320" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">数据 + 允许的响应头</text>
  <!-- 被拒情况 -->
  <rect x="190" y="250" width="260" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="273" text-anchor="middle" font-size="12" fill="#b91c1c">没有这个响应头 → 浏览器直接拦截，JS 拿不到数据</text>
</svg>
