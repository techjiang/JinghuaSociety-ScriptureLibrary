<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 起点 -->
  <rect x="220" y="10" width="200" height="40" rx="20" fill="#2563eb"/>
  <text x="320" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">要给项目选个许可证</text>
  <!-- 第一层 -->
  <line x1="320" y1="50" x2="160" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="50" x2="480" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="80" width="200" height="38" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">想最多人用、最少麻烦</text>
  <text x="160" y="113" text-anchor="middle" font-size="10" fill="#64748b">工具库/脚手架/组件</text>
  <rect x="380" y="80" width="200" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">担心专利/公司项目</text>
  <text x="480" y="113" text-anchor="middle" font-size="10" fill="#64748b">协议要把专利说清</text>
  <!-- 第二层 -->
  <line x1="160" y1="118" x2="160" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="118" x2="480" y2="148" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="148" width="200" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">MIT</text>
  <text x="160" y="181" text-anchor="middle" font-size="10" fill="#1e40af">npm 生态主流，无脑选</text>
  <rect x="380" y="148" width="200" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Apache 2.0</text>
  <text x="480" y="181" text-anchor="middle" font-size="10" fill="#15803d">明确授予专利授权</text>
  <!-- 第三分支 -->
  <line x1="320" y1="118" x2="320" y2="148" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="220" y="148" width="200" height="38" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="320" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">理想主义：改了必须回馈</text>
  <text x="320" y="181" text-anchor="middle" font-size="10" fill="#9a3412">选 GPL，传播会受限</text>
  <!-- 结果 -->
  <line x1="160" y1="186" x2="160" y2="216" stroke="#94a3b8" stroke-width="2"/>
  <line x1="480" y1="186" x2="480" y2="216" stroke="#94a3b8" stroke-width="2"/>
  <line x1="320" y1="186" x2="320" y2="216" stroke="#94a3b8" stroke-width="2"/>
  <rect x="60" y="216" width="200" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="160" y="235" text-anchor="middle" font-size="11" fill="#475569">个人项目默认答案</text>
  <rect x="220" y="216" width="200" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="235" text-anchor="middle" font-size="11" fill="#475569">防云厂商白嫖换 AGPL</text>
  <rect x="380" y="216" width="200" height="30" rx="15" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="235" text-anchor="middle" font-size="11" fill="#475569">大公司项目默认答案</text>
  <!-- 底部 -->
  <rect x="60" y="256" width="520" height="20" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="320" y="270" text-anchor="middle" font-size="11" fill="#b91c1c">没选许可证 ≠ 开源，法律上别人不能用</text>
</svg>
