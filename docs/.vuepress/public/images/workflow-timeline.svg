<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 时间轴主线 -->
  <line x1="40" y1="100" x2="600" y2="100" stroke="#cbd5e1" stroke-width="3"/>
  <!-- 时间块 -->
  <rect x="40" y="30" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">09:30-12:00</text>
  <text x="100" y="64" text-anchor="middle" font-size="10" fill="#1e40af">深度工作①</text>
  <line x1="100" y1="70" x2="100" y2="96" stroke="#2563eb" stroke-width="2"/>

  <rect x="180" y="130" width="120" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">12:00-13:30</text>
  <text x="240" y="164" text-anchor="middle" font-size="10" fill="#15803d">午饭+散步</text>
  <line x1="240" y1="104" x2="240" y2="126" stroke="#16a34a" stroke-width="2"/>

  <rect x="320" y="30" width="120" height="40" rx="8" fill="#e9d5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="380" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#581c87">13:30-15:30</text>
  <text x="380" y="64" text-anchor="middle" font-size="10" fill="#7e22ce">协作：会评/CR</text>
  <line x1="380" y1="70" x2="380" y2="96" stroke="#a855f7" stroke-width="2"/>

  <rect x="460" y="130" width="120" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">15:30-18:00</text>
  <text x="520" y="164" text-anchor="middle" font-size="10" fill="#1e40af">深度工作②</text>
  <line x1="520" y1="104" x2="520" y2="126" stroke="#2563eb" stroke-width="2"/>

  <!-- 晚上 -->
  <rect x="40" y="170" width="540" height="22" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="310" y="185" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="700">晚上：不碰工作代码 —— 睡眠和白天效率都靠它</text>
  <text x="310" y="125" text-anchor="middle" font-size="10" fill="#94a3b8">原则：最难的活，放最清醒的时候</text>
</svg>
