  <rect x="450" y="160" width="150" height="55" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="525" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">容器 C</text>
  <text x="525" y="203" text-anchor="middle" font-size="10" fill="#dc2626">删了不心疼，数据在卷里</text>
  <!-- arrows -->
  <line x1="152" y1="105" x2="222" y2="105" stroke="#2563eb" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="187" y="92" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">build</text>
  <line x1="352" y1="105" x2="442" y2="48" stroke="#2563eb" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="352" y1="105" x2="442" y2="117" stroke="#2563eb" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="352" y1="105" x2="442" y2="187" stroke="#2563eb" stroke-width="2" marker-end="url(#arr3)"/>
  <text x="400" y="105" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">run</text>
  <!-- 注解 -->
  <text x="85" y="175" text-anchor="middle" font-size="11" fill="#94a3b8">一个镜像</text>
