  <text x="290" y="122" text-anchor="middle" font-size="10" fill="#64748b">只读打包文件</text>
  <!-- Containers -->
  <rect x="450" y="20" width="150" height="55" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">容器 A</text>
  <text x="525" y="63" text-anchor="middle" font-size="10" fill="#16a34a">node:22 + 你的代码</text>
  <rect x="450" y="90" width="150" height="55" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="525" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">容器 B</text>
