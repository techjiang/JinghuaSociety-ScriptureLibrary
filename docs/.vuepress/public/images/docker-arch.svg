  <text x="85" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Dockerfile</text>
  <text x="85" y="122" text-anchor="middle" font-size="10" fill="#64748b">镜像制作说明书</text>
  <!-- Image -->
  <rect x="230" y="70" width="120" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
