<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- 工作区 -->
  <rect x="20" y="60" width="120" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">工作区</text>
  <text x="80" y="118" text-anchor="middle" font-size="11" fill="#64748b">你能看到的文件</text>
  <!-- 暂存区 -->
  <rect x="230" y="60" width="120" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">暂存区</text>
  <text x="290" y="118" text-anchor="middle" font-size="11" fill="#64748b">待提交清单</text>
  <!-- 本地仓库 -->
  <rect x="440" y="60" width="120" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">本地仓库</text>
  <text x="500" y="118" text-anchor="middle" font-size="11" fill="#64748b">.git 目录</text>
  <!-- 远程仓库 -->
  <rect x="440" y="10" width="120" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">远程仓库</text>
  <!-- 箭头 -->
  <line x1="145" y1="100" x2="222" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="183" y="88" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">git add</text>
  <line x1="355" y1="100" x2="432" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="393" y="88" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">git commit</text>
  <line x1="565" y1="55" x2="565" y2="25" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="42" font-size="12" fill="#16a34a" font-weight="700">git push</text>
  <line x1="500" y1="25" x2="500" y2="52" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="42" font-size="12" fill="#16a34a" font-weight="700">git pull</text>
  <!-- 底部注释 -->
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#94a3b8">改崩了能退回去</text>
  <text x="290" y="180" text-anchor="middle" font-size="11" fill="#94a3b8">可以挑挑拣拣</text>
  <text x="500" y="180" text-anchor="middle" font-size="11" fill="#94a3b8">提交历史都存这儿</text>
</svg>
