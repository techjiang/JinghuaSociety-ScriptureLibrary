<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 面板网格 -->
  <rect x="20" y="20" width="180" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Elements</text>
  <text x="110" y="72" text-anchor="middle" font-size="10" fill="#64748b">看结构、改样式</text>
  <text x="110" y="90" text-anchor="middle" font-size="10" fill="#64748b">:hov 试悬停状态</text>

  <rect x="220" y="20" width="180" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="310" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Console</text>
  <text x="310" y="72" text-anchor="middle" font-size="10" fill="#64748b">验想法、看报错</text>
  <text x="310" y="90" text-anchor="middle" font-size="10" fill="#64748b">$0 当前选中元素</text>

  <rect x="420" y="20" width="200" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Network</text>
  <text x="520" y="72" text-anchor="middle" font-size="10" fill="#64748b">查请求、看耗时</text>
  <text x="520" y="90" text-anchor="middle" font-size="10" fill="#64748b">Copy as cURL 复现</text>

  <rect x="20" y="140" width="180" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Sources</text>
  <text x="110" y="192" text-anchor="middle" font-size="10" fill="#64748b">打断点、单步调</text>
  <text x="110" y="210" text-anchor="middle" font-size="10" fill="#64748b">F10 跳过 F11 进入</text>

  <rect x="220" y="140" width="180" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="310" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Application</text>
  <text x="310" y="192" text-anchor="middle" font-size="10" fill="#64748b">Cookie/Storage</text>
  <text x="310" y="210" text-anchor="middle" font-size="10" fill="#64748b">排查登录态丢失</text>

  <rect x="420" y="140" width="200" height="100" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
  <text x="520" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">Performance / Lighthouse</text>
  <text x="520" y="192" text-anchor="middle" font-size="10" fill="#64748b">录火焰图找卡顿</text>
  <text x="520" y="210" text-anchor="middle" font-size="10" fill="#64748b">一键出优化报告</text>
</svg>
