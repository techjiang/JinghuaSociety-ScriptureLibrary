<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 标题 -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#1f2937">常用正则模式速查</text>
  <!-- 表头 -->
  <rect x="20" y="40" width="600" height="28" rx="4" fill="#2563eb"/>
  <text x="35" y="59" font-size="12" font-weight="700" fill="#fff">场景</text>
  <text x="200" y="59" font-size="12" font-weight="700" fill="#fff">模式</text>
  <text x="470" y="59" font-size="12" font-weight="700" fill="#fff">备注</text>
  <!-- 行 -->
  <rect x="20" y="68" width="600" height="26" fill="#f8fafc"/>
  <text x="35" y="86" font-size="11" fill="#334155">手机号（大陆）</text>
  <text x="200" y="86" font-family="monospace" font-size="11" fill="#1e40af">^1[3-9]\d{9}$</text>
  <text x="470" y="86" font-size="10" fill="#64748b">宽松版，够用</text>

  <rect x="20" y="94" width="600" height="26" fill="#fff"/>
  <text x="35" y="112" font-size="11" fill="#334155">邮箱</text>
  <text x="200" y="112" font-family="monospace" font-size="11" fill="#1e40af">^[\w.-]+@[\w-]+(\.[\w-]+)+$</text>
  <text x="470" y="112" font-size="10" fill="#64748b">别追求 RFC 完备</text>

  <rect x="20" y="120" width="600" height="26" fill="#f8fafc"/>
  <text x="35" y="138" font-size="11" fill="#334155">URL</text>
  <text x="200" y="138" font-family="monospace" font-size="11" fill="#1e40af">^(https?):\/\/[\w.-]+(:\d+)?(\/\S*)?$</text>
  <text x="470" y="138" font-size="10" fill="#64748b">协议+域名+端口</text>

  <rect x="20" y="146" width="600" height="26" fill="#fff"/>
  <text x="35" y="164" font-size="11" fill="#334155">IPv4（严格）</text>
  <text x="200" y="164" font-family="monospace" font-size="11" fill="#1e40af">^((25[0-5]|2[0-4]\d|[01]?\d?\d)\.){3}...$</text>
  <text x="470" y="164" font-size="10" fill="#64748b">管 0-255 范围</text>

  <rect x="20" y="172" width="600" height="26" fill="#f8fafc"/>
  <text x="35" y="190" font-size="11" fill="#334155">日期</text>
  <text x="200" y="190" font-family="monospace" font-size="11" fill="#1e40af">^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$</text>
  <text x="470" y="190" font-size="10" fill="#64748b">2 月 30 号它不管</text>

  <rect x="20" y="198" width="600" height="26" fill="#fff"/>
  <text x="35" y="216" font-size="11" fill="#334155">去 HTML 标签</text>
  <text x="200" y="216" font-family="monospace" font-size="11" fill="#1e40ab">&lt;[^&gt;]+&gt;</text>
  <text x="470" y="216" font-size="10" fill="#64748b">粗暴版，慎用</text>
  <!-- 陷阱区 -->
  <rect x="20" y="236" width="600" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="35" y="256" font-size="12" font-weight="700" fill="#b91c1c">⚠ 性能红线：嵌套量词</text>
  <text x="35" y="274" font-family="monospace" font-size="11" fill="#b91c1c">^(a+)+$</text>
  <text x="150" y="274" font-size="11" fill="#7f1d1d">匹配长串 a 加一个 b 会指数爆炸，直接卡死。别写 (x+)+ / (x*)* / (x+)*</text>
</svg>
