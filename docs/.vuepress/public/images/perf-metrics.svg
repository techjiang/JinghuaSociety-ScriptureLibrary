<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 时间轴 -->
  <line x1="40" y1="200" x2="600" y2="200" stroke="#cbd5e1" stroke-width="3"/>
  <text x="40" y="222" font-size="11" fill="#94a3b8">页面加载开始</text>
  <text x="560" y="222" font-size="11" fill="#94a3b8">完全可交互</text>
  <!-- FCP -->
  <line x1="130" y1="40" x2="130" y2="200" stroke="#2563eb" stroke-width="2"/>
  <circle cx="130" cy="200" r="6" fill="#2563eb"/>
  <text x="130" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">FCP</text>
  <text x="130" y="70" text-anchor="middle" font-size="10" fill="#64748b">首次内容绘制</text>
  <text x="130" y="86" text-anchor="middle" font-size="10" fill="#64748b">用户看到东西了</text>
  <!-- LCP -->
  <line x1="280" y1="40" x2="280" y2="200" stroke="#16a34a" stroke-width="2"/>
  <circle cx="280" cy="200" r="6" fill="#16a34a"/>
  <text x="280" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">LCP</text>
  <text x="280" y="70" text-anchor="middle" font-size="10" fill="#64748b">最大内容渲染</text>
  <text x="280" y="86" text-anchor="middle" font-size="10" fill="#64748b">主体内容出来了</text>
  <!-- CLS -->
  <rect x="330" y="150" width="180" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="420" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">CLS 累积布局偏移</text>
  <text x="420" y="146" text-anchor="middle" font-size="10" fill="#dc2626">图片没定高 → 文字被挤动 → 用户点错</text>
  <!-- TTI -->
  <line x1="520" y1="40" x2="520" y2="200" stroke="#a855f7" stroke-width="2"/>
  <circle cx="520" cy="200" r="6" fill="#a855f7"/>
  <text x="520" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">TTI</text>
  <text x="520" y="70" text-anchor="middle" font-size="10" fill="#64748b">可交互时间</text>
  <text x="520" y="86" text-anchor="middle" font-size="10" fill="#64748b">点了有反应</text>
  <!-- 建议 -->
  <rect x="40" y="232" width="560" height="22" rx="11" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="320" y="247" text-anchor="middle" font-size="11" fill="#15803d">Core Web Vitals 三兄弟：LCP（快出内容）、INP（响应快）、CLS（别乱动）</text>
</svg>
