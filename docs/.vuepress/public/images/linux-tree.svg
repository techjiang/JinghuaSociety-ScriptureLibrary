<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 终端窗口 -->
  <rect x="20" y="20" width="600" height="240" rx="10" fill="#1e293b"/>
  <rect x="20" y="20" width="600" height="26" rx="10" fill="#0f172a"/>
  <circle cx="42" cy="33" r="5" fill="#f87171"/>
  <circle cx="60" cy="33" r="5" fill="#fbbf24"/>
  <circle cx="78" cy="33" r="5" fill="#34d399"/>
  <text x="320" y="38" text-anchor="middle" font-size="11" fill="#94a3b8">bash — 站长的日常工作台</text>
  <!-- 命令区 -->
  <text x="40" y="66" font-family="monospace" font-size="12" fill="#34d399">user@server:~$</text>
  <text x="175" y="66" font-family="monospace" font-size="12" fill="#e2e8f0">tail -f app.log | grep --line-buffered error | wc -l</text>
  <text x="40" y="90" font-family="monospace" font-size="11" fill="#94a3b8"># 一边跟日志，一边数 error 出现次数（管道组合技）</text>

  <text x="40" y="122" font-family="monospace" font-size="12" fill="#34d399">user@server:~$</text>
  <text x="175" y="122" font-family="monospace" font-size="12" fill="#e2e8f0">lsof -i :3000</text>
  <text x="40" y="146" font-family="monospace" font-size="11" fill="#94a3b8"># 端口被占？看是谁（COMMAND PID USER 一目了然）</text>

  <text x="40" y="178" font-family="monospace" font-size="12" fill="#34d399">user@server:~$</text>
  <text x="175" y="178" font-family="monospace" font-size="12" fill="#e2e8f0">find src -name '*.js' -newer package.json</text>
  <text x="40" y="202" font-family="monospace" font-size="11" fill="#94a3b8"># 找比 package.json 新的 JS —— 定位最近改动的文件</text>

  <text x="40" y="234" font-family="monospace" font-size="12" fill="#34d399">user@server:~$</text>
  <text x="175" y="234" font-family="monospace" font-size="12" fill="#e2e8f0">tar -czvf backup.tar.gz data/ &amp;&amp; echo done</text>
  <text x="40" y="252" font-family="monospace" font-size="11" fill="#94a3b8"># 打包备份，成功再喊一声</text>
</svg>
