<svg xmlns="http://www.w3.org/2000/svg" width="128" height="28" viewBox="0 0 128 28" role="img" aria-label="精链 FeaturedLink (animated)">
  <defs>
    <linearGradient id="flShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d0453a"/>
      <stop offset="100%" stop-color="#a5281f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="28" rx="6" fill="url(#flBg)"/>
  <rect x="1" y="1" width="126" height="26" rx="5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="18.2" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#ffffff">精链 FeaturedLink</text>
  <rect x="-51.2" y="0" width="44.8" height="28" fill="url(#flShine)">
    <animate attributeName="x" from="-51.2" to="128" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
