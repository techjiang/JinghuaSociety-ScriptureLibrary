<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2563eb"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/>
    </marker>
  </defs>
  <!-- 客户端/服务端 -->
  <rect x="40" y="20" width="140" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">客户端</text>
  <rect x="460" y="20" width="140" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="530" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">服务端</text>
  <!-- 生命线 -->
  <line x1="110" y1="66" x2="110" y2="280" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="530" y1="66" x2="530" y2="280" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- 三次握手 -->
  <line x1="110" y1="90" x2="526" y2="90" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>
  <text x="320" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">① SYN（我要连你，seq=x）</text>
  <line x1="530" y1="140" x2="114" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#a2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">② SYN + ACK（好的，seq=y, ack=x+1）</text>
  <line x1="110" y1="190" x2="526" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#a1)"/>
  <text x="320" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">③ ACK（收到，ack=y+1）</text>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="#475569">连接建立，开始传数据</text>
  <!-- 分隔线 -->
  <line x1="40" y1="238" x2="600" y2="238" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- 四次挥手 -->
  <line x1="110" y1="258" x2="526" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
  <text x="320" y="252" text-anchor="middle" font-size="12" fill="#475569">① FIN（我说完了）</text>
  <line x1="530" y1="272" x2="114" y2="272" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#475569">② ACK（知道了）</text>
  <line x1="530" y1="288" x2="114" y2="288" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="320" y="282" text-anchor="middle" font-size="12" fill="#475569">③ FIN（我也说完了）</text>
  <text x="320" y="298" text-anchor="middle" font-size="11" fill="#94a3b8">④ ACK 后连接彻底关闭（图太窄画不下，意会一下）</text>
</svg>
